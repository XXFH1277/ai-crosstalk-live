<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>鲸云社 · mindcraft 配音台</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101c23;color:#eaf1ed;font:15px/1.6 system-ui,"Microsoft YaHei",sans-serif}main{max-width:1100px;margin:30px auto;padding:0 22px}h1{font-size:28px;margin:0}p,small{color:#a1b5bd}section{border:1px solid #354952;background:#172831;border-radius:12px;padding:18px;margin:16px 0}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}input,button{font:inherit;padding:8px 12px;border-radius:6px;border:1px solid #557079;background:#223b44;color:#eef7f3}button{cursor:pointer}button.primary{background:#b7e5bc;color:#102b24}button.stop{background:#5e3432}button:disabled{opacity:.4;cursor:default}#actors{display:grid;grid-template-columns:1fr 1fr;gap:16px}#actors>section{min-width:0}.meta{overflow-wrap:anywhere}.portrait{height:270px;position:relative;overflow:hidden;background:linear-gradient(150deg,#304b55,#183038);border-radius:9px}.rig{width:270px;max-width:100%;aspect-ratio:2/3;position:relative;margin:auto;transform-origin:50% 35%}.body{width:100%;display:block}.patch{position:absolute;display:none;pointer-events:none}.hurt .rig{animation:shake .18s linear 4}.speaking .rig{animation:breathe .8s ease-in-out infinite alternate}.bubble{min-height:54px;font-size:18px;padding:12px 0}.meta{font-size:13px;color:#b0c8cb}.name{font-size:21px;font-weight:700}#phase{padding:8px 0;color:#c6e4c9}#lines{max-height:240px;overflow:auto;padding-left:24px}#lines .skip{color:#7d9198}#error{color:#ffb7ad;min-height:22px}@keyframes shake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}@keyframes breathe{to{transform:translateY(-3px)}}@media(max-width:650px){#actors{grid-template-columns:1fr}.portrait{height:235px}}
</style><main><h1>鲸云社 · mindcraft 配音台</h1><p>深深、月月在游戏里自己干活、自己说话（mindcraft）；这里把她们说的话配上 Breeze 声音，同步立绘口型。</p>
<section><div class="row"><button id="start" class="primary">开启声音</button><button id="stop" class="stop">暂停声音</button><button id="float">打开置顶双人窗</button><button id="sound">试听受击声音</button></div><div id="phase">读取状态…</div><small id="status"></small><div id="error" role="alert"></div></section>
<section><strong>给两人下长期目标</strong><form id="goal-form" class="row"><input id="goal" maxlength="180" placeholder="例：在雪原盖一间小木屋，先备齐木头和圆石" style="flex:1;min-width:220px"><button class="primary" type="submit">下目标</button></form><small>mindcraft 重启后目标会丢失，需要重新下。也可以在游戏里按 T 直接和她们说话。</small></section>
<div id="actors"></div>
<section><strong>最近台词</strong><ol id="lines"></ol><small>配音跟不上时会跳过过时的句子（超过 25 秒），游戏聊天栏里仍然看得到原话。</small></section></main>
<script type="module">
let floating=null,floatClosing=false;
const $=id=>document.getElementById(id)||floating?.document.getElementById(id),names=['深深','月月'],client=crypto.randomUUID();
let state,enabledAudio=false,current=null,seq=0,serverInstance,previewWho=0;
const audio=new Audio(),reflex=new Audio(),cache=new Map(),refTimers={},lastCue={};
let audioContext,analyser,samples,level=0,animationId,animationWindow=window;
const faces=new Map();
for(const who of names){
 const card=document.createElement('section');card.id=who;
 card.innerHTML='<div class="name">'+who+'</div><div class="meta" id="'+who+'-meta">未连接</div><div class="portrait"><div class="rig"><img class="body" src="/assets/'+encodeURIComponent(who+'-基础.png')+'"><img class="patch"></div></div><div class="bubble" id="'+who+'-text">等她开口</div><div class="meta" id="'+who+'-bag"></div>';
 $('actors').append(card);
 fetch('/assets/'+encodeURIComponent(who+'-脸.json')).then(r=>r.json()).then(f=>{
  const p=card.querySelector('.patch'),[x,y,x1,y1]=f.box,[w,h]=f.canvas;
  p.style.cssText='left:'+x/w*100+'%;top:'+y/h*100+'%;width:'+(x1-x)/w*100+'%;height:'+(y1-y)/h*100+'%';
 });
}
function expression(who,mood){if(faces.get(who)===mood)return;faces.set(who,mood);const p=$(who).querySelector('.patch');if(!mood){p.style.display='none';return;}p.src='/assets/'+encodeURIComponent(who+'-脸-'+mood+'.png');p.style.display='block';}
function animateMouth(){
 if(analyser&&current&&!audio.paused){analyser.getFloatTimeDomainData(samples);let sum=0;for(const v of samples)sum+=v*v;level=Math.max(Math.sqrt(sum/samples.length),level*.78);}else level*=.65;
 for(const who of names)if(!refTimers[who])expression(who,current?.who===who&&!audio.paused?(level>.075?'嘴-张大':level>.018?'嘴-半张':null):null);
 animationId=animationWindow.requestAnimationFrame(animateMouth);
}
function moveAnimation(target){animationWindow.cancelAnimationFrame(animationId);animationWindow=target;animationId=target.requestAnimationFrame(animateMouth);}
moveAnimation(window);
const actorHome=$('actors').parentNode,actorNext=$('actors').nextSibling;
const browserHelp='请在 Chrome / Edge 打开 http://127.0.0.1:7862/ 再点置顶按钮。';
$('float').onclick=async()=>{
 if(floating&&!floating.closed){floatClosing=true;floating.close();return;}
 if(!window.documentPictureInPicture){$('error').textContent='当前浏览器不支持桌面置顶。'+browserHelp;return;}
 try{
  const actors=$('actors');floating=await documentPictureInPicture.requestWindow({width:660,height:440});
  floatClosing=false;floating.document.title='鲸云社 · 游戏双人悬浮窗';
  const base=floating.document.createElement('base');base.href=location.origin+'/';floating.document.head.append(base);
  for(const style of document.querySelectorAll('style'))floating.document.head.append(style.cloneNode(true));
  const style=floating.document.createElement('style');style.textContent=`
   html,body{height:100%;overflow:hidden;background:#13262d}body{padding:10px}
   #actors{display:grid;grid-template-columns:1fr 1fr;gap:10px;height:100%}
   #actors>section{margin:0;padding:10px;display:flex;flex-direction:column;min-width:0;overflow:hidden;background:linear-gradient(155deg,#29424b,#15252c);border:1px solid #4d6870}
   .name{font-size:18px;color:#eaf5e9}.meta{display:none}
   .portrait{height:auto;flex:1;min-height:70px;background:none;border-radius:0;display:flex;justify-content:center;align-items:flex-start}
   .rig{width:min(100%,275px);max-width:none;margin:0;flex-shrink:0}
   .bubble{font-size:clamp(14px,2.7vw,20px);line-height:1.4;min-height:70px;max-height:35%;overflow:auto;padding:8px 2px 0;color:#fff3d6;border-top:1px solid #496069}
   .speaking{border-color:#c4e7a4!important}.hurt{border-color:#ff9f93!important}
  `;floating.document.head.append(style);floating.document.body.append(actors);moveAnimation(floating);
  $('float').textContent='收回双人悬浮窗';
  floating.addEventListener('pagehide',()=>{actorHome.insertBefore(actors,actorNext);floating=null;moveAnimation(window);$('float').textContent='打开置顶双人窗';},{once:true});
 }catch(e){$('error').textContent='悬浮窗未打开：'+e.message+'。'+browserHelp;}
};
async function command(action,extra={}){
 try{if(action!=='heartbeat')$('error').textContent='';const r=await fetch('/api/command',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,client,...extra})});const s=await r.json();if(!r.ok)throw Error(s.error);render(s);return true;}
 catch(e){$('error').textContent=e.message;return false;}
}
function render(s){
 if(serverInstance!==s.instance){serverInstance=s.instance;seq=0;cancel();}
 state=s;const sp=s.speech;
 $('phase').textContent=(sp.enabled?sp.phase:'声音未开启')+' · 待配音 '+sp.waiting+' · 已配好 '+sp.buffered+(sp.dropped?' · 已跳过 '+sp.dropped+' 句':'');
 $('status').textContent=s.mindserver+' · '+s.handoff+' · '+s.cueStatus;
 $('start').disabled=sp.enabled||s.cueStatus!=='短音已就绪';$('stop').disabled=!sp.enabled;
 for(const b of s.bots){
  $(b.who+'-meta').textContent=b.online?('血量 '+(b.health??'—')+'/20 · 饱食 '+(b.food??'—')+'/20 · '+(b.action||'空闲')):'不在游戏里';
  $(b.who+'-bag').textContent=b.inventory.length?'背包：'+b.inventory.join('  '):'';
 }
 for(const group of Object.values(s.cues||{}))for(const items of Object.values(group))for(const c of items)if(!cache.has(c.url)){const a=new Audio(c.url);a.preload='auto';a.load();cache.set(c.url,a);}
 $('lines').replaceChildren(...sp.history.slice(-14).reverse().map(h=>{const li=document.createElement('li');li.textContent=h.who+'：'+h.text+(h.status==='已播放'?'':'（'+h.status+'）');if(h.status!=='已播放')li.className='skip';return li;}));
 if(sp.pending&&sp.pending.owner===client&&sp.pending.id>seq)speech(sp.pending);
}
async function finish(status){const line=current;if(!line)return;current=null;audio.pause();$(line.who).classList.remove('speaking');if(!refTimers[line.who])expression(line.who,null);if(!line.preview)await command('ack',{id:line.id,status});}
function cancel(){if(current){const line=current;current=null;audio.pause();$(line.who).classList.remove('speaking');if(!refTimers[line.who])expression(line.who,null);}}
async function speech(line){seq=line.id;if(!enabledAudio){command('ack',{id:line.id,status:'error'});return;}cancel();current=line;$(line.who+'-text').textContent=line.text;$(line.who).classList.add('speaking');audio.src=line.audio;audio.playbackRate=state.playbackRate;try{await audio.play();}catch{finish('error');}}
audio.onended=()=>finish('played');audio.onerror=()=>finish('error');
// 反应脸不叠嘴型；普通台词用音量驱动口型。
function react(e,preview=false){
 const r=e.reaction;if(!preview&&Date.now()>=r.expiresAt)return;const who=r.who;
 clearTimeout(refTimers[who]);$(who).classList.remove('hurt');void $(who).offsetWidth;$(who).classList.add('hurt');expression(who,r.kind==='recovered'?'表情-开心':'表情-惊讶');
 const options=state?.cues?.[who]?.[r.kind]||[],index=((lastCue[who+r.kind]??-1)+1)%Math.max(1,options.length);lastCue[who+r.kind]=index;const cue=options[index];
 if(cue){$(who+'-text').textContent=cue.text;if(enabledAudio){audio.volume=.15;reflex.pause();reflex.src=cue.url;reflex.playbackRate=state.playbackRate;reflex.play().catch(()=>{audio.volume=1;});}}
 refTimers[who]=setTimeout(()=>{delete refTimers[who];expression(who,null);$(who).classList.remove('hurt');},1800);
}
reflex.onended=()=>{audio.volume=1;};reflex.onerror=()=>{audio.volume=1;};
async function unlock(){
 if(!audioContext){try{audioContext=new AudioContext();analyser=audioContext.createAnalyser();analyser.fftSize=512;samples=new Float32Array(analyser.fftSize);audioContext.createMediaElementSource(audio).connect(analyser);analyser.connect(audioContext.destination);}catch{$('error').textContent='嘴型分析暂不可用，声音照常播放';}}
 if(audioContext?.state==='suspended')await audioContext.resume();
 if(enabledAudio)return;
 enabledAudio=true;const cue=state?.cues?.['深深']?.hurt?.[0];
 if(cue){reflex.src=cue.url;reflex.volume=0;try{await reflex.play();reflex.pause();}catch{}reflex.volume=1;
 audio.volume=0;audio.src=cue.url;try{await audio.play();audio.pause();}catch{}audio.volume=1;}
}
$('start').onclick=async()=>{await unlock();await command('start');};
$('stop').onclick=()=>{cancel();command('stop');};
$('sound').onclick=async()=>{await unlock();react({reaction:{who:names[previewWho++%2],kind:'hurt'}},true);};
$('goal-form').onsubmit=async e=>{e.preventDefault();const text=$('goal').value.trim();if(!text)return;if(await command('goal',{text}))$('goal').value='';};
const stream=new EventSource('/events');stream.onmessage=e=>{const event=JSON.parse(e.data);if(event.type==='cancel')cancel();if(event.type==='reaction')react(event);if(event.type==='speech'&&event.owner===client&&event.id>seq)speech(event);if(event.type!=='line')refresh();};
async function refresh(){try{const r=await fetch('/api/state');if(r.ok)render(await r.json());}catch{$('phase').textContent='配音台断开';cancel();}}
setInterval(()=>{refresh();if(state?.speech.enabled)command('heartbeat');},3000);refresh();
</script></html>
